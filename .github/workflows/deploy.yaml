name: Deploy
on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: course.prafdin.ru
          username: password_123
          port: 3102
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /home/password_123/catty-reminders-app
            OWNER=$(echo "${{ github.repository_owner }}" | tr "[:upper:]" "[:lower:]")

            cat > .env <<ENVEOF
            IMAGE=ghcr.io/$OWNER/catty-reminders-app:${{ github.sha }}
            APP_CONTAINER_NAME=catty-app
            DB_CONTAINER_NAME=catty-db
            MARIADB_ROOT_PASSWORD=mypass
            MARIADB_USER=password_123
            MARIADB_PASSWORD=mypass
            MARIADB_DATABASE=catty_reminders
            HOST_DB_PORT=3306
            CONTAINER_DB_PORT=3306
            HOST_APP_PORT=8181
            CONTAINER_APP_PORT=8181
            ENVEOF

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose up -d --pull always --remove-orphans --force-recreate
