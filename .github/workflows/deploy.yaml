name: Deploy
on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: course.prafdin.ru
          username: password_123
          port: 3102
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /home/password_123/catty-reminders-app
            OWNER=$(echo "${{ github.repository_owner }}" | tr "[:upper:]" "[:lower:]")

            # Создаём .env с локальным образом и актуальным SHA
            cat > .env <<ENVEOF
            IMAGE=ghcr.io/$OWNER/catty-reminders-app:local
            APP_CONTAINER_NAME=catty-app
            DB_CONTAINER_NAME=catty-db
            MARIADB_ROOT_PASSWORD=mypass
            MARIADB_USER=password_123
            MARIADB_PASSWORD=mypass
            MARIADB_DATABASE=catty_reminders
            HOST_DB_PORT=3306
            CONTAINER_DB_PORT=3306
            HOST_APP_PORT=8181
            CONTAINER_APP_PORT=8181
            DEPLOY_REF=${{ github.sha }}
            ENVEOF

            # Останавливаем старые контейнеры
            docker compose down --remove-orphans --volumes 2>/dev/null || true
            sudo fuser -k 8181/tcp 2>/dev/null || true
            sudo fuser -k 3306/tcp 2>/dev/null || true
            sleep 2

            # Запускаем с пересозданием (без pull, образ уже локальный)
            docker compose up -d --force-recreate --timeout 30
            docker compose ps
