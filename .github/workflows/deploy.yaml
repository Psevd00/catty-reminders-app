name: Deploy
on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: course.prafdin.ru
          username: password_123
          port: 3102
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /home/password_123/catty-reminders-app
            OWNER=$(echo "${{ github.repository_owner }}" | tr "[:upper:]" "[:lower:]")

            cat > .env <<ENVEOF
            IMAGE=ghcr.io/$OWNER/catty-reminders-app:${{ github.sha }}
            APP_CONTAINER_NAME=catty-app
            DB_CONTAINER_NAME=catty-db
            MARIADB_ROOT_PASSWORD=mypass
            MARIADB_USER=password_123
            MARIADB_PASSWORD=mypass
            MARIADB_DATABASE=catty_reminders
            HOST_DB_PORT=3306
            CONTAINER_DB_PORT=3306
            HOST_APP_PORT=8181
            CONTAINER_APP_PORT=8181
            ENVEOF

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Остановить всё, что связано с проектом
            docker compose down --remove-orphans 2>/dev/null || true
            docker rm -f $(docker ps -q --filter "publish=3306") 2>/dev/null || true
            docker rm -f $(docker ps -q --filter "publish=8181") 2>/dev/null || true
            docker rm -f catty-app catty-db 2>/dev/null || true

            echo "=== Before cleanup: listeners on 8181 ==="
            sudo ss -tlnp | grep 8181 || echo "Port 8181 is free"

            sudo fuser -k 8181/tcp 2>/dev/null || true
            sleep 2
            sudo fuser -k -9 8181/tcp 2>/dev/null || true
            sleep 2

            sudo systemctl stop nginx apache2 demo 2>/dev/null || true

            echo "=== After cleanup: listeners on 8181 ==="
            sudo ss -tlnp | grep 8181 || echo "Port 8181 is free"

            docker compose pull
            docker compose up -d --remove-orphans --force-recreate --timeout 30
          sleep 10
          docker exec -i catty-db mariadb -u root -pmypass catty_reminders -e "CREATE TABLE IF NOT EXISTS users (username VARCHAR(255) PRIMARY KEY, password VARCHAR(255)); INSERT IGNORE INTO users VALUES ('tester', 'foobar123');"
            docker compose ps
