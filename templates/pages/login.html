<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>
<body>
    <h1>Login</h1>
    {% if invalid %}<p style="color:red;">Invalid credentials</p>{% endif %}
    {% if logged_out %}<p>Logged out</p>{% endif %}
    {% if unauthorized %}<p>Unauthorized</p>{% endif %}
    <form method="post" action="/login">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>
</body>
</html>
